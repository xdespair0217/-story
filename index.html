<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古典思維成語繪本 - 智慧宮殿字卡系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0c0c0e;
            color: #e4e4e7;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(217, 119, 6, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(13, 148, 136, 0.05) 0%, transparent 40%);
        }
        .serif-title { font-family: 'Noto Serif TC', serif; font-weight: 900; }
        .card-perspective { perspective: 1800px; }
        .card-inner { transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        .custom-scrollbar::-webkit-scrollbar { width: 7px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 30, 35, 0.5); border-radius: 99px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.3); border-radius: 99px; }
        .gold-glow { box-shadow: 0 0 35px rgba(217, 119, 6, 0.18); }
        .emerald-glow { box-shadow: 0 0 35px rgba(13, 148, 136, 0.18); }
        
        .editable-field[contenteditable="true"] { cursor: text; }
        .editable-field[contenteditable="true"]:focus {
            outline: 2px dashed #d97706;
            background-color: rgba(217, 119, 6, 0.15);
            border-radius: 4px;
            padding: 2px 6px;
        }
        .editable-field[contenteditable="true"]:hover {
            outline: 1px dashed rgba(217, 119, 6, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 lg:p-10 overflow-x-hidden relative">

    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[20%] left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-amber-600/5 blur-[140px] rounded-full"></div>
        <div class="absolute bottom-[10%] left-[10%] w-[450px] h-[450px] bg-teal-600/5 blur-[120px] rounded-full"></div>
    </div>

    <!-- 自定義通用確認彈窗 -->
    <div id="customModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm transition-all duration-300">
        <div class="bg-[#16161c] border border-zinc-800 rounded-2xl w-full max-w-md p-7 shadow-2xl gold-glow flex flex-col gap-5">
            <div class="flex items-center gap-3 border-b border-zinc-800 pb-3">
                <div class="w-11 h-11 rounded-full bg-amber-950/30 border border-amber-600/40 flex items-center justify-center text-amber-500">
                    <i id="modalIcon" class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <h4 id="modalTitle" class="serif-title text-xl text-amber-100">系統提示</h4>
            </div>
            <p id="modalMessage" class="text-sm text-zinc-300 leading-relaxed"></p>
            <div class="flex gap-3 justify-end mt-2">
                <button id="modalCancelBtn" onclick="closeModal()" class="px-5 py-2.5 bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-zinc-200 text-sm rounded-xl transition-all">取消</button>
                <button id="modalConfirmBtn" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-500 text-zinc-950 text-sm font-bold rounded-xl transition-all">確定</button>
            </div>
        </div>
    </div>

    <!-- 圖片全螢幕大圖燈箱 (Lightbox Modal) -->
    <div id="imageLightboxModal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300 cursor-zoom-out" onclick="closeImageLightbox()">
        <div class="relative max-w-5xl max-h-[92vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeImageLightbox()" class="absolute -top-11 right-0 text-zinc-400 hover:text-amber-400 text-base transition p-2 focus:outline-none flex items-center gap-2 font-sans font-bold">
                <i class="fa-solid fa-xmark text-lg"></i> 關閉全螢幕
            </button>
            <img id="lightboxImage" src="" alt="成語插圖大圖" class="max-w-full max-h-[82vh] object-contain rounded-2xl border border-zinc-800 shadow-2xl gold-glow">
            <div id="lightboxCaption" class="mt-4 text-sm font-mono text-zinc-400 tracking-wider flex items-center gap-3">
                <span id="lightboxTitle" class="text-amber-400 font-bold text-base"></span>
                <span class="text-zinc-600">|</span>
                <span id="lightboxFilename" class="text-teal-400"></span>
            </div>
        </div>
    </div>

    <!-- 新增卡片自訂對話框 -->
    <div id="newCardModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm transition-all duration-300">
        <div class="bg-[#16161c] border border-zinc-800 rounded-2xl w-full max-w-md p-7 shadow-2xl gold-glow flex flex-col gap-4">
            <div class="flex items-center gap-3 border-b border-zinc-800 pb-3">
                <div class="w-11 h-11 rounded-full bg-amber-950/30 border border-amber-600/40 flex items-center justify-center text-amber-500">
                    <i class="fa-solid fa-plus text-lg"></i>
                </div>
                <h4 class="serif-title text-xl text-amber-100">建立新成語卡</h4>
            </div>
            <div class="flex flex-col gap-4 text-sm">
                <div>
                    <label class="text-zinc-400 block mb-1">歸屬課文：</label>
                    <input type="text" id="newCardCourseInput" class="w-full bg-[#1c1c24] border border-zinc-700 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-zinc-400 block mb-1">圖片編號 (ID)：</label>
                    <input type="text" id="newCardIdInput" class="w-full bg-[#1c1c24] border border-zinc-700 rounded-xl px-3.5 py-2.5 text-amber-400 font-mono focus:outline-none focus:border-amber-500">
                    <span class="text-xs text-zinc-500 mt-1 block">本機圖檔將對應：<span id="newCardFilePreview" class="text-teal-400 font-mono">--.jpg</span></span>
                </div>
                <div>
                    <label class="text-zinc-400 block mb-1">成語名稱：</label>
                    <input type="text" id="newCardTitleInput" value="新成語名稱" class="w-full bg-[#1c1c24] border border-zinc-700 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-zinc-400 block mb-1">課文音訊連結 (J 欄 music_url，可留空)：</label>
                    <input type="text" id="newCardMusicInput" placeholder="https://.../story_audio.mp3" class="w-full bg-[#1c1c24] border border-zinc-700 rounded-xl px-3.5 py-2.5 text-zinc-100 focus:outline-none focus:border-amber-500 text-xs">
                </div>
            </div>
            <div class="flex gap-3 justify-end mt-2">
                <button onclick="closeNewCardModal()" class="px-5 py-2.5 bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-zinc-200 text-sm rounded-xl transition-all">取消</button>
                <button onclick="confirmAddNewCard()" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-500 text-zinc-950 text-sm font-bold rounded-xl transition-all">確認建立</button>
            </div>
        </div>
    </div>

    <!-- 典籍藏書閣（單元篩選彈窗） -->
    <div id="courseSelectModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300">
        <div class="bg-[#141418] border border-zinc-800 w-full max-w-3xl max-h-[85vh] rounded-3xl p-7 flex flex-col gap-5 shadow-2xl gold-glow relative">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-filter text-amber-500 text-lg"></i>
                    <h3 class="serif-title text-xl text-zinc-100">典籍藏書閣 · 單元篩選</h3>
                    <span id="courseCountTag" class="text-xs text-zinc-500 font-mono bg-zinc-900 px-2.5 py-1 rounded-md border border-zinc-800">0 個單元</span>
                </div>
                <button onclick="toggleCourseModal()" class="text-zinc-400 hover:text-zinc-100 p-2 text-lg transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-zinc-500 text-sm">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="courseSearchInput" oninput="filterCourseGrid()" placeholder="輸入課文名稱或日期關鍵字..." class="w-full bg-[#1c1c24] border border-zinc-700/80 rounded-2xl pl-11 pr-4 py-3 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-amber-500/70 transition shadow-inner">
            </div>

            <div id="courseModalGrid" class="flex-1 overflow-y-auto custom-scrollbar grid grid-cols-1 sm:grid-cols-2 gap-3 p-1"></div>
        </div>
    </div>

    <!-- 全成語點覽目錄（緊湊清單抽屜面板） -->
    <div id="galleryDrawer" class="hidden fixed inset-0 z-40 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300">
        <div class="bg-[#141418] border border-zinc-800 w-full max-w-3xl h-[80vh] rounded-3xl p-7 flex flex-col gap-5 shadow-2xl gold-glow relative">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-table-cells text-amber-500 text-lg"></i>
                    <h3 class="serif-title text-xl text-zinc-100">成語總覽目錄</h3>
                    <span id="galleryCountTag" class="text-xs text-zinc-500 font-mono bg-zinc-900 px-2.5 py-1 rounded-md border border-zinc-800">0 筆</span>
                </div>
                <button onclick="toggleGalleryDrawer()" class="text-zinc-400 hover:text-zinc-100 p-2 text-lg transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="galleryGridContainer" class="flex-1 overflow-y-auto custom-scrollbar grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 p-1 content-start"></div>
        </div>
    </div>

    <!-- 頂部導覽列 -->
    <header class="w-full max-w-3xl z-10 flex flex-col gap-4 mt-2">
        <div class="relative bg-[#16161b] border border-zinc-800 rounded-2xl px-5 py-4 flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-2.5 overflow-hidden mr-3">
                <span class="text-sm text-amber-500/80 font-semibold tracking-wider shrink-0">當前範疇：</span>
                <button onclick="toggleCourseModal()" class="flex items-center gap-2.5 text-base text-amber-400 hover:text-amber-300 font-bold tracking-wide transition truncate focus:outline-none group">
                    <span id="currentCourseTitle" class="truncate">全部成語 (總庫)</span>
                    <i class="fa-solid fa-chevron-down text-xs text-zinc-500 group-hover:text-amber-400 transition shrink-0"></i>
                </button>
            </div>
            
            <div class="flex items-center gap-2.5 shrink-0">
                <button onclick="reloadFromSheets()" title="從試算表重新抓取最新資料" class="flex items-center gap-2 text-xs md:text-sm bg-zinc-900 hover:bg-zinc-800 text-teal-400 border border-zinc-700 px-4 py-2 rounded-xl transition font-bold shadow">
                    <i class="fa-solid fa-rotate"></i>
                    <span>同步</span>
                </button>
                <button onclick="toggleGalleryDrawer()" class="flex items-center gap-2 text-xs md:text-sm bg-zinc-900 hover:bg-zinc-800 text-amber-400 border border-zinc-700 px-4 py-2 rounded-xl transition font-bold shadow">
                    <i class="fa-solid fa-table-cells"></i>
                    <span>總覽</span>
                </button>
                <button id="editModeBtn" onclick="toggleEditMode()" class="flex items-center gap-2 text-xs md:text-sm bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 px-4 py-2 rounded-xl transition font-bold shadow">
                    <i class="fa-solid fa-pen-to-square text-amber-500"></i>
                    <span id="editModeBtnText">開啟編輯</span>
                </button>
            </div>
        </div>

        <!-- 查詢系統與進度條 -->
        <div class="flex flex-col gap-3.5 bg-[#121215]/85 backdrop-blur border border-zinc-800/70 p-5 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center text-xs md:text-sm">
                <span id="cardProgressText" class="text-zinc-400 font-mono font-medium">0 / 0</span>
                <span id="syncStatus" class="text-xs text-teal-400 font-mono">試算表待命</span>
                <div class="flex items-center gap-4">
                    <button onclick="openNewCardModal()" class="hover:text-amber-400 text-zinc-300 transition flex items-center gap-1.5 font-bold">
                        <i class="fa-solid fa-plus text-amber-500"></i> 新增卡片
                    </button>
                    <button onclick="deleteCurrentCard()" class="hover:text-red-400 text-zinc-400 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> 刪除本張
                    </button>
                    <button onclick="triggerResetProgress()" class="hover:text-amber-400 text-zinc-400 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-arrows-rotate"></i> 重置
                    </button>
                </div>
            </div>
            
            <div class="w-full bg-zinc-800/80 h-2 rounded-full overflow-hidden">
                <div id="cardProgressBar" class="bg-gradient-to-r from-amber-600 via-amber-500 to-amber-400 h-full rounded-full transition-all duration-500 shadow" style="width: 0%;"></div>
            </div>

            <!-- 搜尋框 -->
            <div class="relative mt-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-zinc-500 text-sm">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchBar" oninput="handleSearch()" placeholder="全庫檢索：輸入 ID、成語、注音、出處、關鍵字..." class="w-full bg-[#17171c] border border-zinc-800 rounded-xl pl-11 pr-10 py-2.5 text-xs md:text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-amber-500/60 transition-all shadow-inner">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 flex items-center pr-3.5 text-zinc-500 hover:text-zinc-300">
                    <i class="fa-solid fa-circle-xmark text-sm"></i>
                </button>
            </div>
        </div>

        <!-- 狀態篩選標籤 -->
        <div class="flex justify-between gap-3 text-xs md:text-sm font-medium">
            <button onclick="setFilter('all')" id="filter-all" class="flex-1 py-2.5 rounded-xl border border-zinc-700 bg-zinc-800 text-amber-500 font-bold shadow transition">
                全部成語 (<span id="count-all">0</span>)
            </button>
            <button onclick="setFilter('review')" id="filter-review" class="flex-1 py-2.5 rounded-xl border border-zinc-800 text-zinc-400 hover:text-zinc-200 transition">
                待思索 (<span id="count-review">0</span>)
            </button>
            <button onclick="setFilter('mastered')" id="filter-mastered" class="flex-1 py-2.5 rounded-xl border border-zinc-800 text-zinc-400 hover:text-zinc-200 transition">
                已內化 (<span id="count-mastered">0</span>)
            </button>
        </div>
    </header>

    <!-- 主體：3D 翻轉卡片 -->
    <main class="w-full max-w-3xl my-6 flex-1 flex flex-col items-center justify-center z-10">
        <div class="card-perspective w-full aspect-[4/4.3] sm:aspect-[4/3.8] md:aspect-[4/3.5] min-h-[520px] max-h-[660px] cursor-pointer" onclick="handleCardContainerClick(event)">
            <div id="cardInner" class="card-inner w-full h-full relative rounded-3xl shadow-2xl duration-700">
                
                <!-- 卡片正面 -->
                <div class="card-front absolute inset-0 w-full h-full rounded-3xl bg-[#16161c] border border-zinc-800 flex flex-col justify-between p-8 sm:p-12 shadow-2xl gold-glow overflow-hidden">
                    <div class="absolute inset-0 opacity-[0.025] border-[16px] border-amber-600 m-5 pointer-events-none rounded-2xl"></div>
                    
                    <div class="w-full flex justify-between items-center text-amber-500/40 text-xs tracking-widest font-mono">
                        <span id="cardFrontIndex">NO. --</span>
                        <div class="flex items-center gap-2">
                            <span id="cardFrontCourseTag" class="px-3 py-1 rounded-lg bg-amber-950/40 text-amber-500/90 border border-amber-900/50 text-xs font-sans">課文</span>
                        </div>
                    </div>

                    <div class="flex flex-col items-center gap-6 my-auto text-center">
                        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full border border-amber-500/20 flex items-center justify-center mb-2 bg-amber-950/20 shadow-inner">
                            <i class="fa-solid fa-scroll text-amber-500/80 text-2xl sm:text-3xl"></i>
                        </div>
                        <h2 id="cardFrontTitle" class="editable-field serif-title text-5xl sm:text-6xl md:text-7xl text-amber-100 leading-snug tracking-wider drop-shadow-md" contenteditable="false" onblur="saveField('title', this)">
                            載入中...
                        </h2>
                        <div id="cardFrontZhuyin" class="editable-field text-amber-400 text-base sm:text-lg font-medium tracking-widest bg-amber-950/30 px-5 py-1.5 rounded-full border border-amber-800/40 shadow" contenteditable="false" onblur="saveField('zhuyin', this)">
                            ---
                        </div>
                    </div>

                    <div class="w-full text-center flex flex-col items-center gap-2">
                        <p id="cardFrontHint" class="text-zinc-400 text-xs sm:text-sm tracking-widest font-medium animate-pulse">
                            點擊卡片翻轉 · 研讀古典考據
                        </p>
                        <div class="w-12 h-[2px] bg-amber-600/50 mt-1"></div>
                    </div>
                </div>

                <!-- 卡片背面 -->
                <div class="card-back absolute inset-0 w-full h-full rounded-3xl bg-[#131317] border border-zinc-800 flex flex-col p-6 sm:p-8 shadow-2xl emerald-glow overflow-hidden">
                    <div class="w-full h-full overflow-y-auto pr-2 custom-scrollbar flex flex-col gap-5">
                        
                        <!-- 1. 插圖區 -->
                        <div class="w-full aspect-[16/9.5] sm:aspect-[16/8.5] rounded-2xl overflow-hidden relative shadow-inner border border-zinc-800 bg-zinc-950 shrink-0 group cursor-zoom-in" onclick="openImageLightbox(event)">
                            <img id="cardBackImage" src="" alt="精緻插圖" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#131317] via-transparent to-transparent pointer-events-none"></div>
                            <span id="imageTag" class="absolute top-3 left-3 px-2.5 py-1 text-[10px] font-mono tracking-widest bg-black/80 rounded-md text-teal-400 border border-teal-500/30 uppercase pointer-events-none">
                                FILE: --
                            </span>
                            <div class="absolute top-3 right-3 px-3 py-1 text-xs font-mono bg-black/80 rounded-md text-zinc-300 border border-zinc-700/70 opacity-0 group-hover:opacity-100 transition duration-300 pointer-events-none flex items-center gap-1.5 shadow-lg">
                                <i class="fa-solid fa-magnifying-glass-plus text-amber-400"></i> 檢視大圖
                            </div>
                        </div>

                        <!-- 2. 標題與成語發音區（常駐） -->
                        <div class="flex items-start justify-between border-b border-zinc-800/80 pb-4 shrink-0">
                            <div class="flex-1 mr-4">
                                <div class="text-xs text-amber-500 font-mono mb-1.5 flex items-center gap-2.5">
                                    <span>ID：<span id="cardBackIdDisplay" class="editable-field bg-zinc-900 px-2 py-0.5 rounded-md border border-amber-900/50" contenteditable="false" onblur="saveField('id', this)"></span></span>
                                    <span class="text-zinc-600">|</span>
                                    <span>課文：<span id="cardBackCourseDisplay" class="editable-field text-zinc-400" contenteditable="false" onblur="saveField('course', this)"></span></span>
                                </div>
                                <h3 id="cardBackTitle" class="editable-field serif-title text-3xl sm:text-4xl text-zinc-100 tracking-wider" contenteditable="false" onblur="saveField('title', this)">載入中</h3>
                                
                                <div class="flex flex-wrap items-center gap-3 mt-2">
                                    <span id="cardBackZhuyin" class="editable-field text-sm text-amber-400 font-mono tracking-wide" contenteditable="false" onblur="saveField('zhuyin', this)"></span>
                                    <span class="text-zinc-600 text-sm">|</span>
                                    <span id="cardBackSource" class="editable-field text-sm text-zinc-400 font-medium" contenteditable="false" onblur="saveField('source', this)"></span>
                                </div>

                                <div id="cardBackKeywords" class="mt-3">
                                    <span class="text-xs text-zinc-500 block mb-1.5">關鍵字：</span>
                                    <div id="keywordsPillsContainer" class="flex flex-wrap gap-2 mb-1"></div>
                                    <div id="keywordsInputWrapper" class="hidden">
                                        <input type="text" id="cardBackKeywordsInput" class="w-full bg-zinc-900 border border-amber-500/50 text-amber-300 text-xs px-3 py-1.5 rounded-lg" onblur="saveKeywordsInput(this)">
                                    </div>
                                </div>

                                <!-- 音訊網址欄位 (編輯模式下可輸入) -->
                                <div id="musicUrlWrapper" class="mt-2.5 hidden">
                                    <span class="text-[11px] text-zinc-500 block mb-1">課文音訊連結 (J 欄 music_url)：</span>
                                    <input type="text" id="cardBackMusicInput" placeholder="請貼上音訊網址 (如 https://.../story_audio.mp3)" class="w-full bg-zinc-900 border border-teal-500/40 text-teal-300 text-xs px-3 py-1.5 rounded-lg focus:outline-none focus:border-teal-400" onblur="saveMusicUrlInput(this)">
                                </div>
                            </div>
                            
                            <!-- 按鈕一：成語名稱朗讀發音按鈕（常駐） -->

        function parseCSV(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (q && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && next === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') r.push(row);
            return r;
        }

        async function reloadFromSheets() {
            syncStatus.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 同步中...';
            try {
                const bustUrl = `${SHEETS_CSV_URL}&_nocache=${Date.now()}_${Math.random()}`;
                const res = await fetch(bustUrl, {
                    cache: "no-store",
                    headers: {
                        'Pragma': 'no-cache',
                        'Cache-Control': 'no-cache'
                    }
                });
                const csvText = await res.text();
                const rows = parseCSV(csvText);
                
                if (rows.length <= 1) throw new Error("試算表內無資料");

                allMasterCards = [];
                const courseSet = new Set();

                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if ((!r[0] || r[0].trim() === "") && (!r[1] || r[1].trim() === "")) continue;

                    const courseTag = (r[0] && r[0].trim() !== "") ? r[0].trim() : "一般成語";
                    courseSet.add(courseTag);

                    allMasterCards.push({
                        course: courseTag,
                        id: r[1] ? r[1].trim() : `20260906_${i}`,
                        title: r[2] ? r[2].trim() : "",
                        zhuyin: r[3] ? r[3].trim() : "",
                        source: r[4] ? r[4].trim() : "",
                        keywords: r[5] ? r[5].trim() : "",
                        meaning: r[6] ? r[6].trim() : "",
                        sentence: r[7] ? r[7].trim() : "",
                        story: r[8] ? r[8].trim() : "",
                        music_url: r[9] ? r[9].trim() : "",
                        historyCount: r[10] ? r[10].trim() : "0"
                    });
                }

                allCourseCategories = Array.from(courseSet).sort((a, b) => {
                    const dateA = extractDateValue(a);
                    const dateB = extractDateValue(b);
                    if (dateB !== dateA) return dateB - dateA;
                    return a.localeCompare(b);
                });

                selectCourseFilter(selectedCourseFilter);
                syncStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 同步完成 (${allMasterCards.length} 筆)`;
            } catch (err) {
                syncStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-400"></i> 連線失敗';
                showCustomModal("同步失敗", "無法自 Google 試算表取得資料，請檢查網路或發布設定。", false);
            }
        }

        function getNextGlobalDailyId() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const prefix = `${year}${month}${day}_`;

            let maxNum = 0;
            allMasterCards.forEach(card => {
                if (card.id && card.id.startsWith(prefix)) {
                    const numPart = parseInt(card.id.replace(prefix, ""), 10);
                    if (!isNaN(numPart) && numPart > maxNum) {
                        maxNum = numPart;
                    }
                }
            });

            return `${prefix}${maxNum + 1}`;
        }

        }

        function confirmAddNewCard() {
            const customCourse = newCardCourseInput.value.trim() || "預設成語單元";
            const customId = newCardIdInput.value.trim() || getNextGlobalDailyId();
            const customTitle = newCardTitleInput.value.trim() || "新成語名稱";
            const customMusic = newCardMusicInput.value.trim() || "";

            const newCard = {
                course: customCourse,
                id: customId,
                title: customTitle,
                zhuyin: "ㄓㄨˋ ㄧㄣ",
                source: "出處考據",
                keywords: "標籤 關鍵字",
                meaning: "請在此輸入成語的釋義與用法...",
                sentence: "請在此輸入造句範例...",
                story: "請在此輸入歷史故事與典故背景...",
                music_url: customMusic,
                historyCount: "0"
            };

            allMasterCards.unshift(newCard);
            if (!allCourseCategories.includes(customCourse)) {
                allCourseCategories.unshift(customCourse);
            }

            closeNewCardModal();
            currentIndex = 0;
            updateFiltersCount();
            renderCard();

            showCustomModal("建立成功", `已新增字卡【${customTitle} (${customId})】！\n同層圖檔請命名為：${customId}.jpg`, false);

            if (APPS_SCRIPT_WEBAPP_URL) {
                saveField('id', { innerText: customId });
            }
        }

        function deleteCurrentCard() {
            const activeCards = getActiveCards();
            if (activeCards.length === 0) {
                showCustomModal("提示", "目前尚無可刪除的字卡。", false);
                return;
            }

            const card = activeCards[currentIndex];

            showCustomModal("確認刪除", `您確定要永久刪除【${card.title} (${card.id})】嗎？\n雲端試算表中也將同步移除。`, true, async () => {
                const deletedId = card.id;
                
                // 停止音訊
                globalStoryAudioPlayer.pause();
                resetStoryAudioButtonState();

                allMasterCards = allMasterCards.filter(c => c.id !== deletedId);
                if (currentIndex >= getActiveCards().length) {
                    currentIndex = Math.max(0, getActiveCards().length - 1);
                }
                
                updateFiltersCount();
                renderCard();

                if (APPS_SCRIPT_WEBAPP_URL) {
                    syncStatus.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 刪除雲端記錄...';
                    try {
                        await fetch(APPS_SCRIPT_WEBAPP_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ action: "delete", id: deletedId })
                        });
                        syncStatus.innerHTML = '<i class="fa-solid fa-circle-check"></i> 刪除完畢';
                    } catch (e) {
                        syncStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> 刪除失敗';
                    }
                }
            });
        }

        function getActiveCards() {
            let cards = [...allMasterCards];

            if (selectedCourseFilter !== "ALL") {
                cards = cards.filter(card => card.course === selectedCourseFilter);
            }

            if (currentStatusFilter === "review") {
                cards = cards.filter(card => progress.review.includes(card.id));
            } else if (currentStatusFilter === "mastered") {
                cards = cards.filter(card => progress.mastered.includes(card.id));
            }

            if (searchQuery.trim() !== "") {
                const query = searchQuery.toLowerCase().trim();
                cards = cards.filter(card => 
                    (card.id && card.id.toLowerCase().includes(query)) ||
                    (card.course && card.course.toLowerCase().includes(query)) ||
                    (card.title && card.title.toLowerCase().includes(query)) || 
                    (card.meaning && card.meaning.toLowerCase().includes(query)) || 
                    (card.story && card.story.toLowerCase().includes(query)) || 
                    (card.keywords && card.keywords.toLowerCase().includes(query)) ||
                    (card.source && card.source.toLowerCase().includes(query))
                );
            }
            return cards;
        }

        function handleSearch() {
            searchQuery = searchBar.value;
            currentIndex = 0;
            clearSearchBtn.classList.toggle("hidden", searchQuery.length === 0);
            renderCard();
        }

        function clearSearch() {
            searchBar.value = ""; searchQuery = "";
            clearSearchBtn.classList.add("hidden");
            renderCard();
        }

        function tagSearch(tagName) {
            searchBar.value = tagName;
            handleSearch();
        }

        // 僅在有 music_url 時，顯示故事區的課文朗讀播放按鈕
        function updateStoryAudioButtonVisibility(musicUrl) {
            const container = document.getElementById("storyAudioBtnContainer");
            if (musicUrl && musicUrl.trim() !== "") {
                container.classList.remove("hidden");
            } else {
                container.classList.add("hidden");
            }
            resetStoryAudioButtonState();
        }

        function renderCard() {
            // 切換卡片時立即停止任何正在播放的課文音訊與合成語音
            globalStoryAudioPlayer.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            resetStoryAudioButtonState();

            const filtered = getActiveCards();
            
            if (filtered.length === 0) {
                document.getElementById("cardFrontTitle").innerText = "無相符成語";
                document.getElementById("cardFrontZhuyin").innerText = "---";
                document.getElementById("cardFrontIndex").innerText = "NO. --";
                document.getElementById("cardFrontCourseTag").innerText = "無";
                document.getElementById("cardBackTitle").innerText = "空無一物";
                document.getElementById("cardBackZhuyin").innerText = "";
                document.getElementById("cardBackSource").innerText = "";
                document.getElementById("cardBackMeaning").innerText = "當前課文或搜尋條件下查無任何字卡。";
                document.getElementById("cardBackSentence").innerText = "";
                document.getElementById("cardBackStory").innerText = "";
                document.getElementById("cardProgressText").innerText = "0 / 0";
                document.getElementById("cardProgressBar").style.width = "0%";
                updateStoryAudioButtonVisibility("");
                return;
            }

            if (currentIndex >= filtered.length) currentIndex = filtered.length - 1;
            if (currentIndex < 0) currentIndex = 0;

            const card = filtered[currentIndex];
            
            document.getElementById("cardFrontTitle").innerText = card.title || "";
            document.getElementById("cardFrontZhuyin").innerText = card.zhuyin || "";
            document.getElementById("cardFrontIndex").innerText = `NO. ${card.id || '---'}`;
            document.getElementById("cardFrontCourseTag").innerText = card.course || "成語";

            const backImg = document.getElementById("cardBackImage");
            const tagEl = document.getElementById("imageTag");
            bindJpgImage(backImg, card.id, tagEl);

            document.getElementById("cardBackIdDisplay").innerText = card.id || "";
            document.getElementById("cardBackCourseDisplay").innerText = card.course || "";
            document.getElementById("cardBackTitle").innerText = card.title || "";
            document.getElementById("cardBackZhuyin").innerText = card.zhuyin || "";
            document.getElementById("cardBackSource").innerText = card.source || "";
            document.getElementById("cardBackMeaning").innerText = card.meaning || "";
            document.getElementById("cardBackSentence").innerText = card.sentence || "";
            document.getElementById("cardBackStory").innerText = card.story || "";

            if (isEditMode) {
                document.getElementById("cardBackKeywordsInput").value = card.keywords || "";
                document.getElementById("cardBackMusicInput").value = card.music_url || "";
            }
            renderKeywords(card);
            updateStoryAudioButtonVisibility(card.music_url);

            const total = filtered.length;
            document.getElementById("cardProgressText").innerText = `${currentIndex + 1} / ${total}`;
            document.getElementById("cardProgressBar").style.width = `${((currentIndex + 1) / total) * 100}%`;

            updateButtonStyles(card.id);

            const editableElements = document.querySelectorAll('.editable-field');
            editableElements.forEach(el => {
                el.contentEditable = isEditMode ? "true" : "false";
            });
        }

        function renderKeywords(card) {
            const keywordContainer = document.getElementById("keywordsPillsContainer");
            keywordContainer.innerHTML = "";
            if (card.keywords) {
                const tags = card.keywords.split(/[\s,，#]+/).filter(t => t.trim() !== "");
                tags.forEach(tag => {
                    const pill = document.createElement("button");
                    pill.className = "px-3 py-1 bg-amber-950/30 hover:bg-amber-900/50 text-amber-400 hover:text-amber-200 text-xs rounded-lg border border-amber-900/50 transition-all font-medium";
                    pill.innerHTML = `# ${tag}`;
                    pill.onclick = (e) => { e.stopPropagation(); tagSearch(`#${tag}`); };
                    keywordContainer.appendChild(pill);
                });
            }
        }

        function updateButtonStyles(cardId) {
            const isReview = progress.review.includes(cardId);
            const isMastered = progress.mastered.includes(cardId);

            const reviewBtn = document.querySelector("button[onclick=\"markCard('review')\"]");
            const masteredBtn = document.querySelector("button[onclick=\"markCard('mastered')\"]");

            reviewBtn.className = isReview 
                ? "flex-1 py-3.5 px-5 bg-amber-950/40 border border-amber-600 text-amber-300 text-sm sm:text-base font-bold tracking-wider rounded-2xl transition flex items-center justify-center gap-2.5 shadow-inner gold-glow"
                : "flex-1 py-3.5 px-5 bg-[#16161c] border border-zinc-800 text-amber-500 text-sm sm:text-base font-bold tracking-wider rounded-2xl transition flex items-center justify-center gap-2.5 shadow-lg";

            masteredBtn.className = isMastered
                ? "flex-1 py-3.5 px-5 bg-teal-950/40 border border-teal-500 text-teal-300 text-sm sm:text-base font-bold tracking-wider rounded-2xl transition flex items-center justify-center gap-2.5 shadow-inner emerald-glow"
                : "flex-1 py-3.5 px-5 bg-teal-950/25 border border-teal-900/50 text-teal-400 text-sm sm:text-base font-bold tracking-wider rounded-2xl transition flex items-center justify-center gap-2.5 shadow-lg";
        }

        function flipCard() {
            isFlipped = !isFlipped;
            cardInner.classList.toggle("is-flipped", isFlipped);
        }

        function nextCard() {
            const filtered = getActiveCards(); if (filtered.length <= 1) return;
            isFlipped = false; cardInner.classList.remove("is-flipped");
            setTimeout(() => { currentIndex = (currentIndex + 1) % filtered.length; renderCard(); }, 150);
        }

        function prevCard() {
            const filtered = getActiveCards(); if (filtered.length <= 1) return;
            isFlipped = false; cardInner.classList.remove("is-flipped");
            setTimeout(() => { currentIndex = (currentIndex - 1 + filtered.length) % filtered.length; renderCard(); }, 150);
        }

        document.addEventListener("keydown", (e) => {
            if (document.activeElement === searchBar || document.activeElement === courseSearchInput || isEditMode) return;
            if (e.key === "Escape") {
                closeImageLightbox();
                closeModal();
                closeNewCardModal();
            } else if (e.key === "ArrowRight") nextCard();
            else if (e.key === "ArrowLeft") prevCard();
            else if (e.key === " ") { e.preventDefault(); flipCard(); }
        });

        function markCard(status) {
            const filtered = getActiveCards(); if (filtered.length === 0) return;
            const cardId = filtered[currentIndex].id;

            if (status === "review") {
                const index = progress.review.indexOf(cardId);
                if (index > -1) { progress.review.splice(index, 1); } 
                else { progress.review.push(cardId); const mIndex = progress.mastered.indexOf(cardId); if (mIndex > -1) progress.mastered.splice(mIndex, 1); }
            } else if (status === "mastered") {
                const index = progress.mastered.indexOf(cardId);
                if (index > -1) { progress.mastered.splice(index, 1); } 
                else { progress.mastered.push(cardId); const rIndex = progress.review.indexOf(cardId); if (rIndex > -1) progress.review.splice(rIndex, 1); }
            }

            localStorage.setItem("palace_sheets_progress_v2", JSON.stringify(progress));
            updateFiltersCount();
            renderCard();
        }

        function updateFiltersCount() {
            const baseCards = (selectedCourseFilter === "ALL") 
                ? allMasterCards 
                : allMasterCards.filter(c => c.course === selectedCourseFilter);

            const activeIds = baseCards.map(c => c.id);
            const reviewCount = progress.review.filter(id => activeIds.includes(id)).length;
            const masteredCount = progress.mastered.filter(id => activeIds.includes(id)).length;

            document.getElementById("count-all").innerText = baseCards.length;
            document.getElementById("count-review").innerText = reviewCount;
            document.getElementById("count-mastered").innerText = masteredCount;
        }

        function setFilter(filterType) {
            currentStatusFilter = filterType; currentIndex = 0; isFlipped = false; cardInner.classList.remove("is-flipped");
            ["all", "review", "mastered"].forEach(type => {
                const btn = document.getElementById(`filter-${type}`);
                btn.className = (type === filterType)
                    ? "flex-1 py-2.5 rounded-xl border border-zinc-700 bg-zinc-800 text-amber-500 font-bold shadow transition"
                    : "flex-1 py-2.5 rounded-xl border border-zinc-800 text-zinc-400 hover:text-zinc-200 transition";
            });
            renderCard();
        }

        // 功能一：成語名稱常駐語音朗讀（使用瀏覽器原生合成發音）
        function speakIdiomTitle(event) {
            if (event) event.stopPropagation();
            const filtered = getActiveCards();
            if (filtered.length === 0) return;
            const card = filtered[currentIndex];

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(card.title);
                utterance.lang = "zh-TW"; 
                utterance.rate = 0.85;    
                window.speechSynthesis.speak(utterance);
            }
        }

        // 功能二：課文/故事自訂音訊播放（播放試算表 J 欄 music_url）
        function toggleStoryAudioPlay(event) {
            if (event) event.stopPropagation();
            const filtered = getActiveCards();
            if (filtered.length === 0) return;
            const card = filtered[currentIndex];

            if (!card.music_url || card.music_url.trim() === "") return;

            const storyAudioBtnText = document.getElementById("storyAudioBtnText");
            const storyAudioIcon = document.getElementById("storyAudioIcon");

            if (isStoryAudioPlaying) {
                globalStoryAudioPlayer.pause();
                isStoryAudioPlaying = false;
                storyAudioBtnText.innerText = "播放課文";
                storyAudioIcon.className = "fa-solid fa-play text-xs";
            } else {
                if (globalStoryAudioPlayer.src !== card.music_url) {
                    globalStoryAudioPlayer.src = card.music_url;
                }
                globalStoryAudioPlayer.play().then(() => {
                    isStoryAudioPlaying = true;
                    storyAudioBtnText.innerText = "暫停播放";
                    storyAudioIcon.className = "fa-solid fa-pause text-xs";
                }).catch(err => {
                    showCustomModal("音訊播放錯誤", "無法加載該音訊網址，請確認連結是否有效或具有跨域存取權限。", false);
                    resetStoryAudioButtonState();
                });
            }
        }

        function triggerResetProgress() {
            showCustomModal("重置進度", `您確定要重置當前範圍內的待思索與已內化標記嗎？`, true, () => {
                progress = { review: [], mastered: [] };
                localStorage.setItem("palace_sheets_progress_v2", JSON.stringify(progress));
                updateFiltersCount();
                renderCard();
            });
        }

        reloadFromSheets();
    </script>
</body>
</html>
